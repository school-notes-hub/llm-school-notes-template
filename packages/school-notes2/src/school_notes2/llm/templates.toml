# Default role templates (plan 3.4, 7.4). Placeholders: {model}, {effort}.
# The fixed prompt always goes on stdin (Claude Code's --disallowedTools and --mcp-config
# are variadic and would swallow a positional prompt).
# The MCP server is reached through `socat STDIO UNIX-CONNECT:/run/sn/mcp.sock`.
# The *-review variants have no MCP wiring: the reviewer gets no MCP (plan 7.4).

[harnesses.codex]
login_check = ["codex", "login", "status"]
output = "file"
prompt_stdin = true
headless = [
  "codex", "-a", "never", "-s", "danger-full-access",
  "-m", "{model}", "-c", "model_reasoning_effort=\"{effort}\"",
  "-c", "web_search=\"disabled\"",
  "-c", "mcp_servers.sn.command=\"socat\"",
  "-c", "mcp_servers.sn.args=[\"STDIO\",\"UNIX-CONNECT:/run/sn/mcp.sock\"]",
  "exec", "--skip-git-repo-check", "--ephemeral", "--json", "-",
]
interactive = [
  "codex", "-a", "never", "-s", "danger-full-access",
  "-m", "{model}", "-c", "model_reasoning_effort=\"{effort}\"",
  "-c", "web_search=\"disabled\"",
  "-c", "mcp_servers.sn.command=\"socat\"",
  "-c", "mcp_servers.sn.args=[\"STDIO\",\"UNIX-CONNECT:/run/sn/mcp.sock\"]",
]

[harnesses.codex-review]
login_check = ["codex", "login", "status"]
output = "file"
prompt_stdin = true
headless = [
  "codex", "-a", "never", "-s", "danger-full-access",
  "-m", "{model}", "-c", "model_reasoning_effort=\"{effort}\"",
  "-c", "web_search=\"disabled\"",
  "exec", "--skip-git-repo-check", "--ephemeral", "--json", "-",
]
interactive = ["codex", "-a", "never", "-s", "danger-full-access", "-m", "{model}"]

[harnesses.claude]
login_check = ["claude", "auth", "status"]
output = "file"
prompt_stdin = true
headless = [
  "claude", "-p", "--dangerously-skip-permissions",
  "--model", "{model}", "--effort", "{effort}",
  "--output-format", "stream-json", "--verbose",
  "--mcp-config", "{\"mcpServers\":{\"sn\":{\"type\":\"stdio\",\"command\":\"socat\",\"args\":[\"STDIO\",\"UNIX-CONNECT:/run/sn/mcp.sock\"]}}}",
  "--disallowedTools", "WebSearch", "WebFetch",
]
interactive = [
  "claude", "--dangerously-skip-permissions",
  "--model", "{model}", "--effort", "{effort}",
  "--mcp-config", "{\"mcpServers\":{\"sn\":{\"type\":\"stdio\",\"command\":\"socat\",\"args\":[\"STDIO\",\"UNIX-CONNECT:/run/sn/mcp.sock\"]}}}",
  "--disallowedTools", "WebSearch", "WebFetch",
]

# Native Agent/Task tools stay enabled: no --tools allow-list and no Agent/Task denial.
# Subagents share this headless call's timeout and read-only mounts; no MCP is configured.
[harnesses.claude-review]
login_check = ["claude", "auth", "status"]
output = "file"
prompt_stdin = true
headless = [
  "claude", "-p", "--dangerously-skip-permissions",
  "--model", "{model}", "--effort", "{effort}",
  "--output-format", "stream-json", "--verbose",
  "--disallowedTools", "WebSearch", "WebFetch",
]
interactive = ["claude", "--dangerously-skip-permissions", "--model", "{model}"]
