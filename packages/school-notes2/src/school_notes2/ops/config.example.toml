nightly_after = "03:15"
# ~/.config/school-notes/config.toml (plan 3.4). No secrets here.
root = "/srv/school-notes"
secrets_dir = "~/.config/school-notes/secrets"
known_hosts = "~/.config/school-notes/github_known_hosts"
email_to = "laszlo.david@gmail.com"
# Chromium for the study-site (Playwright's copy on the VM).
browser = "~/.cache/ms-playwright/chromium-1208/chrome-linux64/chrome"

[git]
name = "David Laszlo"
email = "laszlo.david@gmail.com"
# The VM reaches GitHub over ssh.github.com:443 (as v1 did).
ssh_hostname = "ssh.github.com"
ssh_port = 443

# One deploy key per repository on the VM (measured 2026-10-03).
[students.benedek]
repo = "git@github.com:school-notes-hub/school-notes-benedek.git"
repo_key = "~/.ssh/school-notes-benedek"
site_repo = "git@github.com:school-notes-hub/benedek9.git"
site_key = "~/.ssh/school-notes-benedek9"
drive_root = "REPLACE-with-folder-id-of-Tanulasi-anyagok/Benedek"
grade = 9
publish = false

[students.barna]
repo = "git@github.com:school-notes-hub/school-notes-barna.git"
repo_key = "~/.ssh/school-notes-barna"
site_repo = "git@github.com:school-notes-hub/barna11.git"
site_key = "~/.ssh/school-notes-barna11"
drive_root = "REPLACE-with-folder-id-of-Tanulasi-anyagok/Barna"
grade = 11
publish = false

# Owner's choice: the automatic writer is Astra/high, the reviewer Opus 5.5/high.
# Effort is at most high; there is no automatic fallback.
[roles.writer]
harness = "codex"
model = "gpt-6-astra"
effort = "high"
timeout_s = 7200
nested_sandbox = false   # bwrap cannot mount /proc in the container (VM check 2026-10-03)

[roles.reviewer]
harness = "claude-review"     # no MCP for the reviewer (plan 7.4)
model = "claude-opus-5-5"
effort = "high"
timeout_s = 5400

[roles.reader]
harness = "claude-review"
model = "claude-opus-5-5"
effort = "high"
timeout_s = 1800
list_timeout_s = 600
recheck_timeout_s = 1200

[roles.figure-review]
harness = "claude-review"
model = "claude-opus-5-5"
effort = "high"
timeout_s = 1800

# The harness templates live in llm/templates.toml of the release; copy them here
# (or override single keys) – see that file.

[timeouts]
drive_call_s = 300
download_package_s = 1200

[sources]
max_side_px = 2000
jpeg_quality = 85
pdf_dpi = 200

[limits]
max_agents = 3
image_daily_usd = 10.0  # Legacy input; only image_monthly_usd limits spending.
min_free_gb = 5.0
