[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-notes2"
version = "2.6.1"
description = "School Notes v2: hourly notebook ingest, nightly review and public site for the learner wikis"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",   # every JSON contract is validated (plan 4)
    "pillow>=11,<13",        # source photos and PDF pages (plan 4.2)
    "pillow-heif>=0.21,<2",  # iPhone HEIC photos
    "pyyaml>=6,<7",          # wiki frontmatter
]

[project.scripts]
school-notes = "school_notes2.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
school_notes2 = ["schemas/*.json", "container/*", "ops/*", "llm/prompts/*.txt", "llm/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
